<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08131f" />
  <meta name="description" content="LAB PORTOS 360 — Laboratório Virtual para formação técnica em Portos." />
  <title>LAB PORTOS 360</title>
  <link rel="stylesheet" href="./assets/css/main.css" />
</head>
<body>
  <a class="skip-link" href="#app">Pular para o conteúdo</a>

  <header class="topbar">

      <span>
        <strong>LAB PORTOS 360</strong>

    </div>

  <main id="app" class="app-shell" tabindex="-1" aria-live="polite"></main>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <div class="noscript">Esta plataforma precisa de JavaScript habilitado.</div>

  <script type="module" src="./assets/js/core/app.js"></script>
